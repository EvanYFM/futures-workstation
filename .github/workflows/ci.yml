name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JS 语法检查（node --check）
        run: |
          set -e
          for f in app.js history-store.js journal-sync.js; do
            [ -f "$f" ] || continue
            node --check "$f"
            echo "✓ $f"
          done

      - name: 数据 JSON 与快照契约校验
        run: |
          python3 - <<'EOF'
          import json, pathlib, sys

          root = pathlib.Path(".")
          files = sorted(root.glob("data/**/*.json")) + [root / "run-manifest.json"]
          bad = []
          for f in files:
              try:
                  json.load(open(f, encoding="utf-8"))
              except Exception as e:
                  bad.append(f"{f}: {e}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print(f"✓ {len(files)} 个 JSON 全部可解析")

          # 懒加载契约：meta 列出的每个日期必须有对应快照文件，且 latestDate 为最新
          meta = json.load(open("data/dashboard-meta.json", encoding="utf-8"))
          missing = [d for d in meta["dates"] if not (root / "data" / "snapshots" / f"{d}.json").exists()]
          if missing:
              print("缺快照文件:", missing); sys.exit(1)
          if meta["latestDate"] != max(meta["dates"]):
              print("latestDate 不是最新日期"); sys.exit(1)
          # 反向守门（2026-09-08 实际踩坑）：快照目录里最新的文件必须被 meta 收录，
          # 否则发布漏更新 meta 时首页会永远停在旧日期
          latest_file = max(p.stem for p in (root / "data" / "snapshots").glob("*.json"))
          if latest_file != meta["latestDate"]:
              print(f"快照目录最新 {latest_file} != meta.latestDate {meta['latestDate']} —— meta 未随发布更新"); sys.exit(1)
          print(f"✓ 快照契约通过：{len(meta['dates'])} 天在册，最新 {meta['latestDate']}")
          EOF
