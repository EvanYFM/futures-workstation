<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="fw-title fw-desc">
  <title id="fw-title">投研全景</title>
  <desc id="fw-desc">投研全景信息架构：期货、A股、美股美债、观澜。期货含行情席位资金、CTA 评分、交易日志与历史回看。</desc>

  <defs>
    <style>
      .sans  { font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
      .paper { fill: #e8e4da; }
      .gray  { fill: #8f8a80; }
      .dim   { fill: #b8b2a6; }
      .up    { fill: #e0563f; }
    </style>
  </defs>

  <rect width="1200" height="420" fill="#12100e"/>

  <g transform="translate(48 0)">
    <text class="sans gray" x="0" y="52" font-size="14" letter-spacing="0.28em">INVESTMENT RESEARCH</text>
    <text class="sans gray" x="1104" y="52" font-size="14" text-anchor="end">evanyfm.github.io/futures-workstation</text>
    <text class="sans paper" x="0" y="118" font-size="58" font-weight="700" letter-spacing="0.06em">投研全景</text>
    <text class="sans dim" x="0" y="162" font-size="20" letter-spacing="0.08em">期货 · A股 · 美股美债 · 观澜</text>
  </g>

  <g class="sans">
    <g transform="translate(48 196)">
      <rect width="262" height="176" rx="12" fill="#1b1916" stroke="#2a2723" stroke-width="1"/>
      <text class="up" x="20" y="36" font-size="13" letter-spacing="0.22em">01</text>
      <text class="paper" x="20" y="72" font-size="26" font-weight="700">期货</text>
      <text class="dim" x="20" y="112" font-size="15">行情 · 席位 · 资金</text>
      <text class="gray" x="20" y="140" font-size="15">CTA · 交易日志 · 历史</text>
    </g>
    <g transform="translate(328 196)">
      <rect width="262" height="176" rx="12" fill="#1b1916" stroke="#2a2723" stroke-width="1"/>
      <text class="up" x="20" y="36" font-size="13" letter-spacing="0.22em">02</text>
      <text class="paper" x="20" y="72" font-size="26" font-weight="700">A股</text>
      <text class="dim" x="20" y="112" font-size="15">行业轮动 · 资金流向</text>
      <text class="gray" x="20" y="140" font-size="15">风格与短线情绪</text>
    </g>
    <g transform="translate(608 196)">
      <rect width="262" height="176" rx="12" fill="#1b1916" stroke="#2a2723" stroke-width="1"/>
      <text class="up" x="20" y="36" font-size="13" letter-spacing="0.22em">03</text>
      <text class="paper" x="20" y="72" font-size="26" font-weight="700">美股美债</text>
      <text class="dim" x="20" y="112" font-size="15">隔夜速览 · 板块轮动</text>
      <text class="gray" x="20" y="140" font-size="15">收益率曲线</text>
    </g>
    <g transform="translate(888 196)">
      <rect width="262" height="176" rx="12" fill="#1b1916" stroke="#2a2723" stroke-width="1"/>
      <text class="up" x="20" y="36" font-size="13" letter-spacing="0.22em">04</text>
      <text class="paper" x="20" y="72" font-size="26" font-weight="700">观澜</text>
      <text class="dim" x="20" y="112" font-size="15">宏观六变量</text>
      <text class="gray" x="20" y="140" font-size="15">框架是否成立</text>
    </g>
  </g>
</svg>
